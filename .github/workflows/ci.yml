name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser checks need a real Chromium and the built app (dist/). test:render
      # proves the SVG output optimizations render identically; e2e smoke-tests the
      # studio (and refreshes docs/screenshot.png — not committed from CI).
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:render
      - run: npm run e2e
