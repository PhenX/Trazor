<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a63"/>
      <stop offset="0.4" stop-color="#7c3b76"/>
      <stop offset="0.72" stop-color="#e2814e"/>
      <stop offset="1" stop-color="#f7cd72"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.4" stop-color="#ffd27f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="1" stop-color="#ffbf63"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9663f"/>
      <stop offset="0.5" stop-color="#7a3a63"/>
      <stop offset="1" stop-color="#241a44"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3a6b"/>
      <stop offset="1" stop-color="#33254f"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a55"/>
      <stop offset="1" stop-color="#211a3d"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="560" height="248" fill="url(#sky)"/>
  <circle cx="280" cy="228" r="150" fill="url(#glow)"/>
  <circle cx="280" cy="232" r="44" fill="url(#sun)"/>

  <!-- distant hills -->
  <path d="M0 214 C 120 190 200 206 280 200 C 360 194 450 210 560 196 L560 248 L0 248 Z" fill="url(#hillA)"/>
  <path d="M0 236 C 150 220 220 232 320 226 C 420 220 500 234 560 228 L560 248 L0 248 Z" fill="url(#hillB)"/>

  <!-- sea -->
  <rect x="0" y="248" width="560" height="152" fill="url(#sea)"/>
  <path d="M258 248 L302 248 L318 400 L242 400 Z" fill="url(#glint)"/>
</svg>
