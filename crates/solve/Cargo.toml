[package]
name = "trazor-solve"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "The boundary solve's descent (band energy, L-BFGS, Moré–Thuente) for @trazor/trace, compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
